# Server settings can be changed here
MaxConnections=100
ServerPort=11000
# If not empty, users will be asked to enter a password to join the server
ServerPassword=
GameMode=SURVIVAL
# Measured in milliseconds. Values less than 1 second will disable auto saving.
SaveInterval=0
MaxBackups=10
InitialSyncTimeout=300000
# Possible values: NONE, PLAYER, DEFAULT, MODERATOR, ADMIN, HOST
DefaultPlayerPerm=PLAYER
# If true, players using localhost get admin by default - disable if you're using a proxy server
LocalhostIsAdmin=True
DefaultOxygenValue=45
DefaultMaxOxygenValue=45
DefaultHealthValue=80
DefaultHungerValue=50.5
DefaultThirstValue=90.5
# Recommended to keep at 0.1 which is the default starting value. If set to 0, new players are cured by default.
DefaultInfectionValue=0.1
# If set to true, the server will try to open ports on your router via UPnP
PortForward=False
# Determines whether the server will listen for and reply to LAN discovery requests.
LanDiscovery=False
# Set to true to Cache entities for the whole map on next run. 
# WARNING! Will make server load take longer on the cache run but players will gain a performance boost when entering new areas.
CreateFullEntityCache=False
Seed=95311395
DisableConsole=False
AdminPassword=
KeepInventoryOnDeath=False
# Places a beacon where players die
MarkDeathPointsWithBeacon=False
PvpEnabled=True
AutoSave=True
# When true, will reject any build actions detected as desynced
SafeBuilding=True
# Command to run following a successful world save (e.g. .exe, .bat, or PowerShell script). 
PostSaveCommandPath=
